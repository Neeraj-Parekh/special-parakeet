  <text x="64" y="146" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600" fill="#1A2233">The goal is not &quot;reduce returns&quot; — nobody can.</text>
  <text x="64" y="167" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="400" fill="#5B6478">The goal: at checkout, in ≤75 ms, decide whether this order is worth shipping —</text>
