  <text x="94" y="569" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">Let me frame the problem the way we&apos;d frame it in a design review. The goal is not &quot;reduce returns&quot;—nobody can. The goal: at checkout time, in under</text>
