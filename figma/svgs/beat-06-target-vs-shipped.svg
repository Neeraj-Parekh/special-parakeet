  <text x="94" y="649" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">So that&apos;s the target architecture. Here&apos;s what we actually built—and every piece of it is clickable. The trust core is real: the Merkle chain, the bounded agent,</text>
