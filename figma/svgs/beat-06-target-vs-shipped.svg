  <text x="64" y="588" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="400" fill="#5B6478">Production runs Kafka + Flink. The demo runs the same detection logic on an in-process engine — Vercel can&apos;t host Kafka. Same alert, different transport.</text>
