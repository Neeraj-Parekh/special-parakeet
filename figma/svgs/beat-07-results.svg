  <text x="792" y="501" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">honest Python ceiling: 45–75 ms p50</text>
  <rect x="48" y="679" width="27" height="18" rx="9" fill="#02042B" fill-opacity="0.08"/><text x="61.5" y="691.24" font-family="JetBrains Mono, Roboto Mono, monospace" font-size="9" font-weight="500" fill="#02042B" text-anchor="middle">VO</text>
  <text x="94" y="692" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">Results. On around 1.3 lakh real orders—Amazon India and public datasets—with a strict time split: PR-AUC 0.11, which is 5.7× base rate, ROC 0.89. The stronger number is the</text>
  <text x="94" y="706" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">cross-check: on Olist, real data with per-customer history, the same pipeline scores 0.40—32× base rate. Against the fifty-thousand-crore number we opened with, even a</text>
  <text x="94" y="720" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">fraction of that signal is real money back. The gaps, before you ask. The deployed console runs a deterministic mock scorer today—the Python scorer wires with one environment</text>
  <text x="94" y="734" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">variable. Ensemble probabilities run hot; calibration is planned and ranking-neutral. The Merkle chain in file-mode breaks across processes—Postgres mode holds; that&apos;s a</text>
  <text x="94" y="748" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">thirty-minute migration. Multi-AZ and the Go hot path are documented plans, not deployed—we won&apos;t claim them. And we will not claim sub-ten-millisecond latency; the honest</text>
  <text x="94" y="762" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">Python ceiling is 45–75 ms p50.</text>
