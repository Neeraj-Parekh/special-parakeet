# infra/k8s/multi-az/network-policy.yaml
#
# Default-deny egress + explicit allow-list to the RDS Postgres
# (port 5432), MSK Kafka (port 9094), and the cluster DNS (port 53).
# Everything else is denied — a compromised pod cannot exfiltrate data
# to an attacker's S3 bucket or phone home via HTTPS.
#
# Pair with the Deployment in deployment.yaml. The pods the policy
# targets are matched by the same label selector.
#
# Production note: this manifest requires a CNI that supports
# network policies (Calico, Cilium, AWS VPC CNI with policy
# enforcement enabled). EKS's default CNI is AWS VPC CNI — set
# `ENABLE_NETWORK_POLICY=true` on the EKS add-on or install Calico.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rto-api-egress
  namespace: rto-trust-layer
  labels:
    app.kubernetes.io/name: rto-trust-layer
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multi-az
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rto-trust-layer
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the ingress controller namespace only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS — needed for service discovery (MSK brokers, RDS endpoints).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres (RDS) — the AZ-aware pool targets one of three AZs.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # Kafka (MSK) — for the streaming seam (src/lib/streaming/redis-stream.ts
    # → src/stream/kafka_producer.py in production).
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9094
