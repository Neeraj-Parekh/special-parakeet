  <text x="94" y="713" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">A naive version of this is one model behind one API—and at real volume it breaks three specific ways: attackers probe the threshold until they find it, one write race corrupts a mandate counter, and a</text>
  <text x="94" y="727" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">regulator asks for proof of a decision that only ever existed as a log line. So here&apos;s what actually holds up.</text>
<text x="48" y="756" font-family="JetBrains Mono, Roboto Mono, monospace" font-size="9" font-weight="400" fill="#5B6478">was: vision_production_stack.excalidraw · live-draw · full narration maps 1:1 onto FIG.02</text>
