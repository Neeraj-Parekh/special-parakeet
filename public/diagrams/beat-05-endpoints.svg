  <text x="94" y="569" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="400" fill="#5B6478">Around that core: JWT auth with replay detection, case management with SLA clocks, a fraud-ring graph detector, and courier and payment integrations—each with a</text>
