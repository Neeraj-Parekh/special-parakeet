# Docker Release — build and push the production image to GHCR (ghcr.io)
# on every `v*` tag push. Reusable for manual dispatch via workflow_dispatch.
#
# Multi-arch (amd64 + arm64) via `docker/setup-qemu-action@v3` so the image
# runs on both x86 EC2 + Graviton (the V3 architecture's "future-proof
# ARM64 path" — Track B §container). GHA BuildKit cache (`type=gha`)
# keeps repeat builds <30s for unchanged layers.
#
# Authentication: `GITHUB_TOKEN` is automatically provisioned by Actions
# with `packages: write` (set in `permissions:` below) — no PAT needed
# since the user's repo is now PRIVATE. (Per the parent task spec: "the
# user's GitHub repo is now PRIVATE so `GITHUB_TOKEN` works for GHCR +
# Pages without extra config.")
#
# Tags (via `docker/metadata-action@v5`):
#   * `ghcr.io/<owner>/<repo>:latest`      — always (rolling)
#   * `ghcr.io/<owner>/<repo>:<version>`   — semver from tag (e.g. v1.2.3 → 1.2.3)
#   * `ghcr.io/<owner>/<repo>:sha-<sha7>`  — short SHA for traceability
#
# Track J (Day 3) §B item — production container build/release.

name: Docker Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}  # manual trigger for release-day dry-runs

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # QEMU + Buildx for multi-arch builds. QEMU emulates arm64 on the
      # amd64 runner so a single buildx invocation produces both manifests.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR using the auto-provisioned GITHUB_TOKEN (repo is
      # private so this works without extra PAT configuration).
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate tags + labels from the git ref. The metadata-action handles
      # the semver extraction (v1.2.3 → 1.2.3, latest on tags) so we don't
      # duplicate that logic here. `ghcr.io/${{ github.repository }}` is the
      # canonical GHCR path — GHCR auto-lowercases the owner/repo on push.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            latest

      # Build + push. The GHA cache (`type=gha`) mounts the BuildKit cache
      # in the runner's GH cache backend — repeat builds of unchanged
      # Dockerfile layers are <5s.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print the pushed manifest so the Actions log shows the multi-arch
      # digests (useful for the release notes — Track J §release).
      - name: Inspect pushed image
        if: always()
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:latest" || true
