# Alembic configuration for the RTO Trust Layer.
# Day 2 Track E — Postgres + Alembic dual-mode DB refactor.
#
# The DSN is intentionally left blank here; ``alembic/env.py`` reads it from
# ``src.config.get_settings().database_url`` (which itself reads the
# ``DATABASE_URL`` env var or ``.env``). This means the same alembic.ini works
# locally (DATABASE_URL=postgresql://risk:risk@localhost:5432/riskdb) and in
# docker-compose (DATABASE_URL=postgresql://risk:risk@postgres:5432/riskdb).
#
# Run migrations on a laptop after pulling:
#   docker compose --profile full up -d postgres
#   docker compose run --rm api alembic upgrade head
#
# Or, if running uvicorn locally against a bare Postgres:
#   DATABASE_URL=postgresql://risk:risk@localhost:5432/riskdb alembic upgrade head

[alembic]
# Path to the migration scripts. Raw-SQL ``op.execute()`` style — V3 rejected
# SQLAlchemy ORM (04-TECH-STACK-DECISIONS.md §"DB"). Each migration is plain
# SQL via ``op.execute("CREATE TABLE ...")``.
script_location = alembic

# Template used for new-migration file generation. "Generic" gives us raw
# ``op.execute()`` SQL without binding to SQLAlchemy MetaData reflection.
file_template = %%(rev)s_%%(slug)s

# Timezone for the ``creation_date`` stamp in migration filenames. UTC keeps
# the audit trail consistent with the audit_records.created_at TIMESTAMPTZ.
timezone = UTC

# Maximum length of an autogenerate identifier — not used (we hand-write
# migrations) but set so alembic doesn't print a warning.
truncate_slug_length = 40

# Output encoding — UTF-8 for the SQL DDL with TIMESTAMPTZ + JSONB.
output_encoding = utf-8

# The DSN is intentionally empty — see comment block at top of this file.
# ``alembic/env.py`` overrides it from src.config.Settings().database_url.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
