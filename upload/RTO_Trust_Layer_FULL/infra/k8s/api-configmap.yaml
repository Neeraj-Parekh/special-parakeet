apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: rto-trust-layer
  labels:
    app.kubernetes.io/name: rto-trust-layer
    app.kubernetes.io/component: api
data:
  RTO_ENV: production
  LOG_LEVEL: info
  # Redis URL — the api-deployment wires this as REDIS_URL so the
  # StreamProducer + KafkaProducer fallback path pick up Redis Streams.
  REDIS_URL: redis://redis:6379/0
  # Kafka toggle — leave blank for Redis Streams (default). Set to
  # "kafka:9092" when the optional Kafka broker is deployed.
  KAFKA_BROKERS: ""
  # Auto-heal backend — dry_run by default. Flip to "k8s" when the
  # service account has permission to restart pods (see RBAC note in
  # README.md).
  RTO_HEAL_BACKEND: dry_run
  # OTel — disabled by default. Point at a Jaeger/OTel collector when
  # distributed tracing is needed.
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
