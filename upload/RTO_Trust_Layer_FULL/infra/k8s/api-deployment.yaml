apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rto-trust-layer
  labels:
    app.kubernetes.io/name: rto-trust-layer
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rto-trust-layer
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rto-trust-layer
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          # Built from the repo root Dockerfile. For a remote cluster,
          # push to a registry + replace with your registry URL:
          #   image: ghcr.io/<owner>/<repo>:latest
          image: rto-trust-layer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: postgres-creds
          env:
            - name: RTO_SCORER_KEYS
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: scorer
            - name: RTO_ADMIN_KEYS
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: admin
            - name: RTO_MANDATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: mandate
            - name: RTO_AUDIT_SALT
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: salt
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Liveness: is the process alive? Hit /health every 30s.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness: is the app ready to serve? Hit /health every 10s.
          # Pod receives traffic only when this passes.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup: give the model load + lifespan hooks up to 60s
          # before liveness kicks in (HistGB + ONNX load takes ~3s
          # on a cold start, but a slow image pull on first deploy
          # could delay the process start — this probe shields against
          # that).
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
