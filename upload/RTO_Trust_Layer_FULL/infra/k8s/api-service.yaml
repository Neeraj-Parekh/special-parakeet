apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rto-trust-layer
  labels:
    app.kubernetes.io/name: rto-trust-layer
    app.kubernetes.io/component: api
spec:
  # ClusterIP for in-cluster consumers (StreamProcessor, admin CLI).
  # Flip to LoadBalancer when exposing publicly on a cloud K8s.
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: rto-trust-layer
    app.kubernetes.io/component: api
