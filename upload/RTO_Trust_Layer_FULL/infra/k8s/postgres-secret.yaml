# Template secret — REPLACE the base64 values with real credentials before
# `kubectl apply -f`. These are NOT real credentials; they're placeholders
# that satisfy the Secret schema so the StatefulSet can mount them.
#
# Generate real base64 values with:
#   echo -n 'your-password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: postgres-creds
  namespace: rto-trust-layer
  labels:
    app.kubernetes.io/name: rto-trust-layer
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: rto
  POSTGRES_PASSWORD: CHANGE_ME_IN_PRODUCTION
  POSTGRES_DB: rto_trust
  # The full DATABASE_URL the FastAPI app reads. The StatefulSet's env
  # wires this as DATABASE_URL so the AuditLogger + mandate counters +
  # idempotency cache pick up Postgres mode automatically.
  DATABASE_URL: postgresql://rto:CHANGE_ME_IN_PRODUCTION@postgres:5432/rto_trust
