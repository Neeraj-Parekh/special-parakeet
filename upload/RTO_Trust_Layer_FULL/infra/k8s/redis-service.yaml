apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rto-trust-layer
  labels:
    app.kubernetes.io/name: rto-trust-layer
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: rto-trust-layer
    app.kubernetes.io/component: cache
