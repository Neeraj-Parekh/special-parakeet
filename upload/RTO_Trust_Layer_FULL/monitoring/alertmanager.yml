global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity", "component"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers: ["severity=critical"]
      receiver: critical
      group_wait: 10s
      repeat_interval: 30m
    - matchers: ["severity=warning"]
      receiver: warning
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url: "http://localhost:5001/webhook"
        send_resolved: true

  - name: critical
    webhook_configs:
      # Replace with your real Slack/PagerDuty webhook URL
      - url: "http://localhost:5001/critical"
        send_resolved: true

  - name: warning
    webhook_configs:
      - url: "http://localhost:5001/warning"
        send_resolved: true

inhibit_rules:
  - source_matchers: ["severity=critical"]
    target_matchers: ["severity=warning"]
    equal: ["component"]
