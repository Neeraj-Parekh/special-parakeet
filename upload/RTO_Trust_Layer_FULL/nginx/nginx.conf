events { worker_connections 1024; }

http {
    upstream api { server api:8000; }

    # Rate-limit per client IP — 25 req/s with burst capacity handled per-route.
    limit_req_zone $binary_remote_addr zone=api:10m rate=25r/s;

    # ─── Compression ───────────────────────────────────────────────────────────
    # Shrink JSON/HTML/CSS/JS payloads above 1KB before they hit the wire.
    # `gzip_vary` adds `Vary: Accept-Encoding`; `gzip_proxied` compresses even
    # for proxied responses (the API is the upstream — we want those compressed).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # ─── Access / error logs ───────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 64k;

        # ─── TLS stub (uncomment + provide certs to go HTTPS in prod) ───────────
        # Run `certbot --nginx -d rto.example.com` to obtain Let's Encrypt certs,
        # then uncomment this block and switch the listen line to `listen 443 ssl http2;`.
        # listen 443 ssl;
        # ssl_certificate     /etc/letsencrypt/live/rto.example.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/rto.example.com/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 10m;

        # ─── Security headers (always = apply to all responses incl. errors/proxies) ──
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

        location /dashboard/ {
            proxy_pass http://api/dashboard/;
        }
        location /health { proxy_pass http://api/health; }
        location /metrics {
            # /metrics exposes raw Prometheus metrics — gate by RFC-1918 + loopback.
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://api/metrics;
        }
        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }
    }
}
