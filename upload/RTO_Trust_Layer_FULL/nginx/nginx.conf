events { worker_connections 1024; }

http {
    upstream api { server api:8000; }

    limit_req_zone $binary_remote_addr zone=api:10m rate=25r/s;

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 64k;

        location /dashboard/ {
            proxy_pass http://api/dashboard/;
        }
        location /health { proxy_pass http://api/health; }
        location /metrics {
            allow 172.16.0.0/12; allow 10.0.0.0/8; allow 127.0.0.1;
            deny all;
            proxy_pass http://api/metrics;
        }
        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }
    }
}
