# ─────────────────────────────────────────────────────────────────────────────
# Build system — declares how `uv build` / `pip wheel` produces the sdist+wheel.
# Hatchling is the standard PEP 517 backend for pure-Python projects.
# ─────────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ─────────────────────────────────────────────────────────────────────────────
# Project metadata — declares the package to PyPI / `uv sync` / `pip install -e .`
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "rto-trust-layer"
version = "0.4.0"
description = "Merchant-facing RTO risk command center"
readme = "README.md"
requires-python = ">=3.12"
# Runtime deps — pinned to the same floors as requirements.txt.
# Day 6 Track 12-bc — re-added `shap>=0.42` (was removed earlier as a
# "dead dep — never imported"; now actually wired into
# `src/models/explain.py::explain_with_shap()` for the
# `/v1/explain/shap` endpoint). Dual-mode via try/except ImportError so the
# API boots without shap installed.
# Day 2 Track E additions: psycopg v3 (raw, NO ORM per 04-TECH-STACK-DECISIONS),
# alembic, pydantic-settings, cachetools (TTLCache for the file-mode idempotency
# cache — closes the §A item 2 memory leak even without DATABASE_URL set).
# Day 2 Track F additions: redis>=5.0 (Redis Streams producer/consumer + HLL).
# Closes §A item 18 + driver G2 (REST-only, no event/streaming backbone).
# Day 4 Track M additions: opentelemetry-api/sdk/exporter-otlp — core OTel
# packages for the manual span on /risk/score. The instrumentation-* packages
# below add auto-spans for FastAPI/requests/psycopg.
# Day 6 Track 12-bc additions:
#   - shap>=0.42 — SHAP KernelExplainer (Lundberg 2017 NeurIPS §3 "KernelSHAP").
#   - opentelemetry-distro + instrumentation-fastapi/requests/psycopg —
#     auto-creates server/client/db spans. Dual-mode (try/except ImportError
#     inside src/api/otel.py::instrument_app) so the API boots without these.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.8",
    "fastapi>=0.136",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "cachetools>=5.3",
    "redis>=5.0",
    # Day 6 Track 12-bc — SHAP KernelExplainer for /v1/explain/shap
    # (Lundberg & Lee 2017 NeurIPS §3 "KernelSHAP"). Dual-mode via
    # try/except ImportError in src/models/explain.py.
    "shap>=0.42",
    # Day 4 Track M — OpenTelemetry core (API + SDK + OTLP exporter). The
    # 3 packages below are the minimum for the manual span on /risk/score.
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    # Day 6 Track 12-bc — OTel instrumentation layer. Auto-creates spans
    # for FastAPI server requests + outbound HTTP + psycopg queries.
    # Dual-mode (try/except ImportError inside src/api/otel.py::
    # instrument_app) so the API boots without these.
    "opentelemetry-distro>=0.50",
    "opentelemetry-instrumentation-fastapi>=0.50",
    "opentelemetry-instrumentation-requests>=0.50",
    "opentelemetry-instrumentation-psycopg>=0.50",
]

# Dev / lint / test extras — `uv sync --extra dev` or `pip install -e .[dev]`.
[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]

# Console-script entry points.
# - `rto-evaluate` runs the train/eval pipeline (replaces `python scripts/evaluate.py`).
# - The API server is intentionally NOT wired here because `create_app` is a
#   factory function (not a bare ASGI callable). Document the run command in
#   the README instead:
#     uvicorn src.api.routes:create_app --factory --host 0.0.0.0 --port 8000
#   Track K (Day 3) owns the README update.
[project.scripts]
rto-evaluate = "scripts.evaluate:main"

# Tell hatchling which packages to include in the wheel. `scripts/` is a
# loose-script folder (no __init__.py) — kept out of the wheel; `scripts.evaluate`
# still resolves in editable installs because the project root is on sys.path.
[tool.hatch.build.targets.wheel]
packages = ["src"]

# ─────────────────────────────────────────────────────────────────────────────
# Ruff — kept from the original config (verify.sh runs `ruff check src scripts tests`).
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
